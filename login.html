<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>চেয়ারম্যান লগইন - সংবাদ.কম</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>🗞️ সংবাদ.কম</h1>
                <h3>চেয়ারম্যান লগইন পোর্টাল</h3>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">ইউজারনেম</label>
                    <input type="text" id="username" placeholder="ইউজারনেম লিখুন" required>
                </div>

                <div class="form-group">
                    <label for="password">পাসওয়ার্ড</label>
                    <input type="password" id="password" placeholder="পাসওয়ার্ড লিখুন" required>
                </div>

                <button type="submit" class="btn btn-login-submit">লগইন করুন</button>
            </form>

            <div id="errorMessage" class="error-message" style="display:none;"></div>
            <div id="successMessage" class="success-message" style="display:none;"></div>

            <div class="login-info">
                <p><strong>পরীক্ষামূলক ক্রেডেনশিয়াল:</strong></p>
                <p>ইউজারনেম: <code>admin</code></p>
                <p>পাসওয়ার্ড: <code>Sangbad@2024</code></p>
            </div>

            <p class="login-footer">
                <a href="index.html">← হোমে ফিরে যান</a>
            </p>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
